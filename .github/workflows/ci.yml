name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run compile

      - name: Extension tests
        run: npm test

      - name: Resolver tests
        run: |
          pip install --only-binary :all: -r requirements-dev.txt
          npm run test:resolver

      - name: Build
        run: npm run build

      - name: Package and check VSIX size
        run: |
          mkdir -p releases
          npm run package
          SIZE=$(stat -c%s releases/aiworkspacemanager-*.vsix)
          echo "VSIX size: $SIZE bytes"
          if [ "$SIZE" -gt 2097152 ]; then
            echo "::error::VSIX exceeds 2 MB"
            exit 1
          fi

  publish:
    name: Publish to Marketplace
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run vscode:prepublish

      - name: Check release version
        id: release_gate
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to VS Code Marketplace
        if: steps.release_gate.outputs.publish == 'true'
        run: npx --yes --ignore-scripts @vscode/vsce publish --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Read version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag release
        if: steps.release_gate.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Package .vsix
        if: steps.release_gate.outputs.publish == 'true'
        run: npx --yes --ignore-scripts @vscode/vsce package --no-dependencies --out aiworkspacemanager.vsix

      - name: Create GitHub Release
        if: steps.release_gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: aiworkspacemanager.vsix
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
