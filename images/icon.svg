<?xml version="1.0" encoding="UTF-8"?>
<!--
  AI Workspace Manager icon: source of truth for images/icon.png.

  Monochrome: one glyph colour (#ededed) on a neutral tile (#1f1f1f). No blue
  disc, no gradient.

  The brain-and-circuitry geometry is Lucide's "brain-circuit" glyph, scaled into
  the tile. It is used rather than hand-drawn on purpose: three hand-drawn
  silhouettes in a row read as a cloud with lines in it, because a brain is a
  bumpy, front-heavy, base-narrowed shape, not a scalloped circle. See NOTICE.

  Lucide static v1.62.0 — ISC licence, copyright Cole Bemis and Lucide
  contributors. https://lucide.dev

  Re-render with:
    npx -y sharp-cli -i images/icon.svg -o images/icon.png resize 256 256
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256" role="img" aria-label="AI Workspace Manager">
  <rect width="128" height="128" rx="26" ry="26" fill="#1f1f1f"/>

  <!-- Lucide viewBox is 24x24; scale 4.4 leaves a comfortable margin, and the
       stroke scales with it (1.8 x 4.4 = 7.9 units of 128). -->
  <g transform="translate(13.6,13.6) scale(4.2)"
     fill="none" stroke="#ededed" stroke-width="1.45"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 13h4"/>
    <path d="M12 18h6a2 2 0 012 2v1"/>
    <path d="M12 8h8"/>
    <path d="M12 9a4.17 4.17 0 01-3 4"/>
    <path d="M16 8V5a2 2 0 012-2"/>
    <path d="M6 18a4 4 0 01-2-7.465"/>
    <path d="M6.004 5.125a4 4 0 00-2.526 5.77"/>
    <path d="M6.294 6.294A3 3 0 1112 5v13a4 4 0 11-7.967-.518"/>
    <!-- terminal dots: enlarged from Lucide's decorative r=0.5 so they survive
         being rendered at 42 px -->
    <circle cx="16" cy="13" r="0.62" fill="#ededed"/>
    <circle cx="18" cy="3" r="0.62" fill="#ededed"/>
    <circle cx="20" cy="21" r="0.62" fill="#ededed"/>
    <circle cx="20" cy="8" r="0.62" fill="#ededed"/>
  </g>
</svg>
