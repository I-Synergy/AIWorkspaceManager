<?xml version="1.0" encoding="UTF-8"?>
<!--
  Activity Bar icon for AI Manager.

  VS Code paints view-container icons with the current theme foreground, so this
  is stroke-only with no fill and no tile: it inherits the active/inactive colour
  automatically. 24x24, the size the Activity Bar expects.

  Same Lucide "brain-circuit" geometry as images/icon.svg — ISC licence, see
  ../NOTICE.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 13h4"/>
  <path d="M12 18h6a2 2 0 012 2v1"/>
  <path d="M12 8h8"/>
  <path d="M12 9a4.17 4.17 0 01-3 4"/>
  <path d="M16 8V5a2 2 0 012-2"/>
  <path d="M6 18a4 4 0 01-2-7.465"/>
  <path d="M6.004 5.125a4 4 0 00-2.526 5.77"/>
  <path d="M6.294 6.294A3 3 0 1112 5v13a4 4 0 11-7.967-.518"/>
  <circle cx="16" cy="13" r="0.6" fill="currentColor"/>
  <circle cx="18" cy="3" r="0.6" fill="currentColor"/>
  <circle cx="20" cy="21" r="0.6" fill="currentColor"/>
  <circle cx="20" cy="8" r="0.6" fill="currentColor"/>
</svg>
